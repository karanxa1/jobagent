# jobagent configuration. Secrets live in .env (never here).

resume: assets/resume.pdf      # your resume PDF (keep it small: some ATS uploads cap at 2-5 MB)
profile: profile.yaml          # generated by `jobagent profile`, then reviewed/edited by you
db: jobs.db
artifacts_dir: artifacts       # screenshots, agent transcripts, cover letters

azure:                         # auth = your `az login` session, no key needed
  endpoint: https://YOUR-RESOURCE.cognitiveservices.azure.com
  deployment: YOUR-DEPLOYMENT   # a vision + tool-calling chat model; drives the browser + writes answers
  fallback_deployment: YOUR-FALLBACK-DEPLOYMENT   # optional; used when the main one errors
  api_version: 2025-04-01-preview
  reasoning_effort: low        # browser steps: low is fast and plenty; raise to medium if forms trip it up

cloudflare:                    # CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN in .env
  triage_model: clef-flash     # bulk job filtering
  verify_model: clef           # post-submit screenshot verification
  concurrency: 48              # parallel clef requests

search:
  max_age_days: 45
  locations: [India, Bengaluru, Mumbai, Hyderabad, Delhi NCR, Chennai, Remote]   # where to search

candidate:                     # used by triage to judge every posting; write them about yourself
  eligibility: >-
    The candidate lives in India, is an Indian citizen without foreign work authorization, and will relocate
    anywhere if a visa is sponsored.
  fit: >-
    builds production LLM systems (agents, tool calling, RAG, evals) with Python / TypeScript backends?

triage:
  accept_role_types: [ai_engineer]   # AI-first roles only. Others: ml_engineer, research, data, intern, not_ai
  min_ai_role: 0.60            # P(role is AI/ML/LLM engineering)
  max_ineligible: 0.60         # reject only if P(explicitly needs work auth the candidate lacks) >= this
  max_seniority: 2.85          # 0=intern,1=1-3y,2=3-6y,3=6+y/staff ; skips only clear staff/principal roles

apply:
  workers: 8                   # total browsers over all processes; ~1 GB RAM each. The RAM guard (min_free_gb) holds new ones back
  processes: 1                 # raise to 2 above ~20 workers: one Python event loop starves past ~25 browsers
  min_free_gb: 2               # never start a browser if it would leave less than this much RAM free
  new_browser_gb: 1.0          # headroom a new browser needs on top of min_free_gb
  headless: true               # false = visible Chrome windows (cascaded); true = invisible, a bit faster
  captcha_wait_seconds: 0       # 0 = flag captchas immediately (nobody at the screen); 240 when you are around
  submit: true                 # false = fill everything but stop before the final submit (dry run)
  max_per_run: 0               # 0 = no cap
  # speed: fewer, bigger agent steps (measured before: 15 s/step median, 14 steps/application)
  flash_mode: true
  max_actions_per_step: 12
  vision_detail: low
  page_wait: 0.3
  action_wait: 0.15
  max_steps: 250               # browser-agent step budget per application (no practical limit)
  max_attempts: 2
  # Per-site limits. Logged-in boards ban accounts that apply in bursts, budget or not.
  host_concurrency: {default: 20, ashbyhq.com: 1, greenhouse.io: 40, lever.co: 1, linkedin.com: 2, naukri.com: 6, wellfound.com: 4, instahyre.com: 6, workatastartup.com: 4, hirist.tech: 6, cutshort.io: 6}
  host_daily_cap: {linkedin.com: 60, naukri.com: 160, wellfound.com: 125, instahyre.com: 150, workatastartup.com: 60}
  host_min_gap_seconds: {default: 5, ashbyhq.com: 180, greenhouse.io: 5, lever.co: 60, linkedin.com: 60, naukri.com: 15, wellfound.com: 30, instahyre.com: 15, workatastartup.com: 30, hirist.tech: 10, cutshort.io: 10}
  chrome_path: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome   # real Chrome: fewer captchas than bundled Chromium
  # Sites where applying needs an account: skipped until `jobagent login` saves a session.
  login_hosts: [linkedin.com, naukri.com, wellfound.com, instahyre.com, ycombinator.com, workatastartup.com, hirist.tech, cutshort.io, microsoft.com]   # microsoft: Google/LinkedIn sign-in only
  # Bot protection that blocks automated browsers outright (DataDome, Cloudflare walls): only `jobagent assist`.
  assist_only_hosts: [smartrecruiters.com, himalayas.app, lever.co, zohorecruit.in, zohorecruit.com, keka.com, ceipal.com, myworkdayjobs.com, myworkdaysite.com]   # always a captcha on submit
  # Sites that flag headless Chrome as spam: run these in a visible (still fully automated) Chrome window.
  headful_hosts: []
  # Sites that reject automated submissions even in a visible browser (Ashby: "flagged as possible spam").
  # Never automated; `jobagent manual` writes MANUAL_APPLY.md with links + cover letters to submit by hand.
  manual_hosts: []              # e.g. [ashbyhq.com] if a site keeps flagging automated submissions as spam
  # Sites that email a security code on every application: held while otp.provider is none.
  otp_hosts: [greenhouse.io]
  skip_ats: []                 # e.g. [workday] to skip account-creation-heavy portals

daemon:
  interval_minutes: 180        # `jobagent run --daemon` re-discovers and applies on this cadence

otp:
  provider: imap               # imap (Gmail app password) | bridge (a Claude Code session with the Gmail connector) | mcp | none
  mcp:                         # any Gmail MCP server that can search + read mail
    command: npx
    args: ["-y", "@gongrzhe/server-gmail-autoauth-mcp"]
    search_tool: search_emails
    search_arg: query
    read_tool: read_email
    read_arg: messageId
  imap:                        # fallback: Gmail app password in .env as GMAIL_APP_PASSWORD
    host: imap.gmail.com
    user: you@gmail.com

logins:
  profile_dir: browser_profiles/login
  storage_state: browser_profiles/storage_state.json

sources:                       # see jobagent/sources/__init__.py: disable / only / extra_slugs / portfolio_boards
  disable: []
resume_url: ""                  # optional public link to your resume, given to the email-sending helper
